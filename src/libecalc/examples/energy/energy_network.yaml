# Energy network for INST_A — ltp_export example
#
# Energy flow:
#
#   fuel_gas ──► genset_a ──► base_load (5 MW)
#       │            ├──────► steamgen (3 MW)
#       │            ├──────► heating_sat_a (2 MW)
#       │            └──────► waterinj_motor ──► waterinj_train (process sim)
#       │
#       ├──► export_turbine ──► export_train (process sim)
#       │
#       └──► [gas_compressor_sampled turbine] ──► gas_compressor_sampled (FILE)
#
#   flare_gas ──► flare (1200 Sm3/d)
#
#   diesel ──► diesel_consumers (500 l/d)
#
#   power_from_shore ──► subsea_cable ──┐
#                                       ├──► electrical_bus ──► heating (10 MW)
#   wind_turbine ───────────────────────┘
#
# The bus dispatches with PRIORITY in INPUT order: the subsea cable first, then wind.
# Each INPUT CAPACITY is a dispatch limit measured at the bus, after upstream losses:
# 20 MW from shore through a 97 % efficient cable delivers 19.4 MW to the bus. The
# limits guide the split but never clip demand. Demand beyond both limits is placed on
# the last input, and a physical overload is reported by the supplying unit itself.
# An input without CAPACITY is unlimited for dispatch, until a deliverability rule exists.

ENERGY_NETWORK:
  SOURCES:
    - NAME: fuel_gas
      TYPE: FUEL_GAS_SOURCE

    - NAME: flare_gas
      TYPE: FUEL_GAS_SOURCE

    - NAME: diesel
      TYPE: DIESEL_SOURCE

    - NAME: power_from_shore
      TYPE: ELECTRICAL_SOURCE
      CAPACITY: 20  # MW

    - NAME: wind_turbine
      TYPE: ELECTRICAL_SOURCE
      CAPACITY: 4.4  # MW

  UNITS:
    # --- Converters ---
    - NAME: genset_a
      TYPE: GENERATOR_SET
      INPUT: fuel_gas
      MODEL: genset_17mw
      CAPACITY: 17  # MW

    - NAME: export_turbine
      TYPE: GAS_TURBINE
      INPUT: fuel_gas
      MODEL: turbine_30mw
      CAPACITY: 30  # MW

    - NAME: waterinj_motor
      TYPE: ELECTRICAL_MOTOR
      INPUT: genset_a
      EFFICIENCY: 0.95
      CAPACITY: 5  # MW

    - NAME: subsea_cable
      TYPE: ELECTRICAL_CABLE
      INPUT: power_from_shore
      EFFICIENCY: 0.97

    # --- Junctions ---
    - NAME: electrical_bus
      TYPE: ELECTRICAL_BUS
      INPUT:
        - NAME: subsea_cable
          CAPACITY: 19.4  # MW at the bus: 20 MW from shore at 97 % cable efficiency
        - NAME: wind_turbine
          CAPACITY: 4.4  # MW
      DISPATCH_STRATEGY: PRIORITY

    # --- Consumers ---
    - NAME: base_load
      TYPE: ELECTRICAL_CONSUMER
      INPUT: genset_a
      LOAD: 5  # MW

    - NAME: steamgen
      TYPE: ELECTRICAL_CONSUMER
      INPUT: genset_a
      LOAD: 3

    - NAME: heating_sat_a
      TYPE: ELECTRICAL_CONSUMER
      INPUT: genset_a
      LOAD: 2

    - NAME: heating
      TYPE: ELECTRICAL_CONSUMER
      INPUT: electrical_bus
      LOAD: 10

    - NAME: flare
      TYPE: FUEL_GAS_CONSUMER
      INPUT: flare_gas
      RATE: 1200  # Sm3/d

    # Sampled from a FUEL+POWER table: a turbine feeding the compressor is generated automatically
    - NAME: gas_compressor_sampled
      TYPE: COMPRESSOR_SAMPLED
      INPUT: fuel_gas
      FILE: gas_compressor_sampled.csv
      RATE: 2500000  # Sm3/d
      SUCTION_PRESSURE: 40  # bara
      DISCHARGE_PRESSURE: 120  # bara

    - NAME: diesel_consumers
      TYPE: DIESEL_CONSUMER
      INPUT: diesel
      RATE: 500  # l/d

    # Process simulation driven
    - NAME: export_train
      TYPE: MECHANICAL_CONSUMER
      INPUT: export_turbine
      PROCESS_SIMULATION: export_compressor_sim

    - NAME: waterinj_train
      TYPE: MECHANICAL_CONSUMER
      INPUT: waterinj_motor
      PROCESS_SIMULATION: waterinj_pump_sim
