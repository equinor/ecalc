auto_update:
  cooldown_days: 3

default_stages:
  - "pre-commit"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch  # Do not allow commits to master/main branch
        priority: 10
      - id: debug-statements  # Looks for debugger imports and `breakpoint()`
        priority: 10
      - id: mixed-line-ending  # Replaces mixed line ending to the most common
        priority: 10
        exclude: |
          (?x)^(
              \.ts|
              \.tsx
          )
      - id: detect-private-key  # Checks for private keys
      - id: check-merge-conflict  # Check for merge conflict strings
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 'a56c0b927e6465d37cae3e97d35d4d18ab2b96cd'  # frozen: v0.16.9
    hooks:
      - id: ruff
        priority: 10
        files: ^(src/.*\.py|tests/.*\.py)$
        exclude: gen/|\.git|\.hg|\.mypy_cache|\.tox|\.venv|_build|buck-out|build|dist
        args:
          - --fix
      #          - --unsafe-fixes # Enable this to allow potentially unsafe fixes, such as those that may change code behavior. Use with caution.
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: '57b21406f092110c18776e39b0bda50d37c945c8' # frozen: v2.4.3
    hooks:
      - id: codespell
        priority: 10
        name: Check for typos in code
        additional_dependencies: [ tomli ]
        exclude: docs/docs/changelog/changelog.md|.*\.ipynb
        args: ["--write-changes"]  # Instead of just complaining about typos, automatically fix them in the files.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724  # frozen: v9.27.0

    hooks:
      - id: commitlint
        priority: 10
        stages: [ commit-msg ]
        additional_dependencies: [ '@commitlint/config-conventional' ]

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: 4dd8831c5f12599465d4d45c3c447b4018a34c85  # frozen: v3.97.9
    hooks:
      - id: trufflehog
        priority: 10
        stages: [ "pre-commit" ]
        entry: trufflehog git file://. --since-commit HEAD --fail -x .trufflehogignore

  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4  # frozen: v3.21.2
    hooks:
      - id: pyupgrade
        priority: 10
        args: [ "--py312-plus" ]

  - repo: local
    hooks:
      - id: basedpyright
        priority: 10
        name: basedpyright
        entry: uv run --frozen --active basedpyright
        language: system
        types: [ python ]
        pass_filenames: false
