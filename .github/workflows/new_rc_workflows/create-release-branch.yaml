name: Create release branch

on:
  workflow_call:
    inputs:
      release_version:
        description: "The release version to create a release branch for"  # Full version with rcN
        required: true
        type: string
      target_branch:
        description: "The target branch to create the release branch for"  # e.g., main or release/vX.Y
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_version:
        description: "The release version to create a release branch for"  # Full version with rcN
        required: true
        type: string
      target_branch:
        description: "The target branch to create the release branch for"  # e.g., main or release/vX.Y
        required: true
        type: string

permissions: { }

env:
    RELEASE_VERSION: ${{ inputs.release_version }}
    TARGET_BRANCH: ${{ inputs.target_branch }}

jobs:
  create-branch:
    name: Create release branch
    continue-on-error: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Pick up commit to create branch from
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - name: Copy version file to local cicd dir
        run: |
          mkdir -p ./cicd/common
          cp ./src/common/version.py ./cicd/common/version.py  # TODO: Make this shared later, and enforce no external deps
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - name: Set up Python
        run: uv python install
      - name: Create vX.Y release branch (for simpler patching) - if normal release (not patching)
        working-directory: ./cicd
        run: |
          MAJOR_MINOR=$(python get_libecalc_version.py version_string=${RELEASE_VERSION} --get-major-minor)
          PATCH=$(python get_libecalc_version.py version_string=${RELEASE_VERSION} --get-patch)
          RELEASE_CANDIDATE=$(python get_libecalc_version.py version_string=${RELEASE_VERSION} --get-release-candidate)
          echo "MAJOR_MINOR: ${MAJOR_MINOR}"
          echo "PATCH: ${PATCH}"
          echo "RELEASE_CANDIDATE: ${RELEASE_CANDIDATE}"
          if [ "${PATCH}" = "0" ] && [ "${RELEASE_CANDIDATE}" = "0" ]; then
            git checkout -b "${TARGET_BRANCH}" "${{ github.sha }}"
            git push -u origin "${TARGET_BRANCH}"
          fi
