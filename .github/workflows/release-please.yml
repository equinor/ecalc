name: release-please

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v*


permissions: { }

jobs:
  get_versioning_strategy:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine versioning strategy
        id: versioning-strategy
        run: |
          echo "Determining versioning strategy..."
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "versioning_strategy=always-bump-major" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == release/v* ]]; then
            echo "versioning_strategy=always-bump-patch" >> $GITHUB_OUTPUT
          fi
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: 'release-please-config.json'
          manifest-file: '.release-please-manifest.json'
          versioning-strategy: ${{ needs.get_versioning_strategy.outputs.versioning_strategy }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  create-output-artifact:
    needs: release-please
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Create output directory
        run: mkdir -p release-please-data
      - name: echo release_created output
        run: echo ${NEEDS_RELEASE_PLEASE_OUTPUTS_RELEASE_CREATED}
        env:
          NEEDS_RELEASE_PLEASE_OUTPUTS_RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
      - name: set release created
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: |
          echo '{"release_created":"true"}' > release-please-data/outputs.json
      - name: set release NOT created
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        run: |
          echo '{"release_created":"false"}' > release-please-data/outputs.json
      - name: Upload release-please data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-please-outputs
          path: release-please-data/
      - name: Get libecalc versions from tag name
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.tag_name }}
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: |
          echo "tag name: ${ NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME }"
          VERSION="${ needs.release-please.outputs.tag_name#v }}"
          PATCH_VERSION="${{ needs.release-please.outputs.tag_name##*. }}"
          MAJOR_MINOR_VERSION="${{ needs.release-please.outputs.tag_name%.* }}" # drops substring from last occurrence of substring (.) until end of string
          echo "patch version: $PATCH_VERSION"
          echo "patch_version=$PATCH_VERSION" >> $GITHUB_OUTPUT
      - name: Create release branch (vX.Y) for patching, if from main
        if: ${{ needs.release-please.outputs.release_created == 'true' && github.ref_name == 'main' }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          MAJOR_MINOR_VERSION="${VERSION%.*}" # drops substring from last occurrence of substring (.) until end of string
          PATCH_VERSION="${VERSION##*.}"
          echo "patch version: $PATCH_VERSION"
          if [ "$PATCH_VERSION" = "0" ]; then
            git checkout -b "release/v${MAJOR_MINOR_VERSION}" "${{ github.sha }}"
            git push -u origin release/v${MAJOR_MINOR_VERSION}
          fi
