name: release-please

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what release would be created without making changes)'
        type: boolean
        default: true
  push:
    branches:
      - main
      - release/v*

permissions: { }

jobs:
  # NOTE: The `versioning-strategy` input of googleapis/release-please-action is silently
  # ignored when `config-file`/`manifest-file` (manifest mode) is used. The actual
  # versioning strategy must instead come from the `versioning-strategy` field inside
  # the config file itself. This job therefore picks
  # the config file to use rather than passing a strategy input to the action.
  get_release_please_config_file:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      config_file: ${{ steps.determine-config-file.outputs.config_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine config file
        id: determine-config-file
        run: |
          echo "Determining config file..."
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            CONFIG_FILE="release-please-config.json"
          elif [[ "${GITHUB_REF_NAME}" == release/v* ]]; then
            CONFIG_FILE="release-please-config-release.json"
          else
            echo "Error: Unable to determine config file for branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "config_file=${CONFIG_FILE}" >> $GITHUB_OUTPUT
  release-please:
    needs: get_release_please_config_file
    if: ${{ inputs.dry_run != true }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: ${{ needs.get_release_please_config_file.outputs.config_file }}
          manifest-file: '.release-please-manifest.json'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  release-please-dry-run:
    needs: get_release_please_config_file
    if: ${{ inputs.dry_run == true }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: 'false'
      - name: Dry run - show planned release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_FILE: ${{ needs.get_release_please_config_file.outputs.config_file }}
          REPO_URL: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          echo "========================================"
          echo "  DRY RUN - no changes will be made"
          echo "========================================"
          echo ""
          echo "Branch: ${TARGET_BRANCH}"
          echo "Config file: ${CONFIG_FILE}"
          echo ""
          OUTPUT=$(npx release-please@17.11.2 release-pr \
            --token="${GITHUB_TOKEN}" \
            --repo-url="${REPO_URL}" \
            --target-branch="${TARGET_BRANCH}" \
            --config-file="${CONFIG_FILE}" \
            --manifest-file=".release-please-manifest.json" \
            --dry-run 2>&1) || true
          echo "$OUTPUT"
          echo ""

          VERSION=$(echo "$OUTPUT" | grep -oP 'v\d+\.\d+\.\d+' | head -1)
          if [ -n "$VERSION" ]; then
            echo "========================================"
            echo "  Simulated outcome"
            echo "========================================"
            echo ""
            echo "Release version: $VERSION"
            STRIPPED="${VERSION#v}"
            MAJOR_MINOR="${STRIPPED%.*}"
            PATCH="${STRIPPED##*.}"
            echo "Major.Minor: $MAJOR_MINOR"
            echo "Patch: $PATCH"
            if [ "$PATCH" = "0" ] && [ "${TARGET_BRANCH}" = "main" ]; then
              echo "Would create release branch: release/v${MAJOR_MINOR}"
            else
              echo "No new release branch would be created."
            fi
          else
            echo "No release would be created."
          fi

  create-output-artifact:
    needs: release-please
    if: ${{ inputs.dry_run != true }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # due to the branch creation below
      - name: Create output directory
        run: mkdir -p release-please-data
      - name: echo release_created output
        run: echo "${RELEASE_CREATED}"
        env:
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
      - name: set release created
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: |
          echo '{"release_created":"true"}' > release-please-data/outputs.json
      - name: set release NOT created
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        run: |
          echo '{"release_created":"false"}' > release-please-data/outputs.json
      - name: Upload release-please data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-please-outputs
          path: release-please-data/
      - name: Create release branch (vX.Y) for patching, if from main
        if: ${{ needs.release-please.outputs.release_created == 'true' && github.ref_name == 'main' }}
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "tag name: ${RELEASE_VERSION}"
          VERSION="${RELEASE_VERSION#v}"
          PATCH_VERSION="${VERSION##*.}"
          MAJOR_MINOR_VERSION="${VERSION%.*}"
          echo "patch version: $PATCH_VERSION"
          if [ "$PATCH_VERSION" = "0" ]; then
            git config user.name "eCalc GitHub Actions Bot"
            git config user.email "<>"
            git checkout -b "release/v${MAJOR_MINOR_VERSION}" "${{ github.sha }}"
            git push -u origin "release/v${MAJOR_MINOR_VERSION}"
          else
            echo "No release branch created, patch version is not 0."
          fi
