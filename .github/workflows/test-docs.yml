name: Build and Test Docs

on:
  workflow_dispatch:
  workflow_call:

permissions: { }

jobs:
  build-docs:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Generate docs
        run: docs/scripts/generate-docs.sh

      - name: Ensure generated nextgen example model is up to date
        run: |
          generated_paths="src/libecalc/examples/nextgen"
          if [ -n "$(git status --porcelain -- $generated_paths)" ]; then
            echo "::error::The generated nextgen example model is out of date. Run 'docs/scripts/generate-docs.sh' (or 'uv run python src/generate_fixture.py') and commit the changes in $generated_paths."
            git status --porcelain -- $generated_paths
            git diff -- $generated_paths
            exit 1
          fi

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: ./docs
        run: npm run typecheck

      - name: Test by building website
        working-directory: ./docs
        run: npm run build
