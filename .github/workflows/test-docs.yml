name: Build and Test Docs

on:
  workflow_dispatch:
  workflow_call:

permissions: { }

jobs:
  build-docs:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Generate docs
        run: docs/scripts/generate-docs.sh

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: ./docs
        run: npm run typecheck

      - name: Test by building website
        working-directory: ./docs
        run: npm run build

      - name: Check docs pages referenced from libecalc
        run: uv run python src/check_docs_links.py docs/build
