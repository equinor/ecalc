name: Build and Test Docs

on:
  workflow_dispatch:
  workflow_call:

permissions: { }

jobs:
  build-docs:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Ensure generated YAML reference and changelog are up to date
        run: |
          cd src
          uv run python generate_yaml_asset_docs.py
          cd ..
          generated_paths="docs/docs/about/nextgen/process-reference.mdx docs/docs/about/nextgen/energy-reference.mdx docs/docs/about/nextgen/yaml-reference.mdx docs/docs/about/nextgen/yaml-changelog"
          if [ -n "$(git status --porcelain -- $generated_paths)" ]; then
            echo "::error::The generated YAML documentation is out of date. A YAML schema change must be documented with yaml_element_lifecycle(...) or removed_field(...). Run 'uv run ./generate_yaml_asset_docs.py' from libecalc/src and commit the result."
            git status --porcelain -- $generated_paths
            git diff -- $generated_paths
            exit 1
          fi

      - name: Ensure generated nextgen example model is up to date
        run: |
          cd src
          uv run python generate_fixture.py
          cd ..
          generated_paths="src/libecalc/examples/nextgen docs/docs/about/nextgen/examples"
          if [ -n "$(git status --porcelain -- $generated_paths)" ]; then
            echo "::error::The generated nextgen example model is out of date. Run 'uv run python generate_fixture.py' from libecalc/src and commit the result."
            git status --porcelain -- $generated_paths
            git diff -- $generated_paths
            exit 1
          fi

      - name: Generate CLI reference
        run: |
          uv run typer src/ecalc_cli/main.py utils docs > ./docs/docs/about/getting_started/cli/cli_reference.md

      - name: Generate JSON Schema
        run: |
          cd src
          uv run python generate_json_schema.py > ../docs/docs/about/getting_started/yaml/ecalc_json_schema.json

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: ./docs
        run: npm run typecheck

      - name: Test by building website
        working-directory: ./docs
        run: npm run build
